<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow</title>
</head>
<body>
    <h1>Регистрация</h1>

    <form id="register-form">
        <input
            type="text"
            name="username"
            placeholder="Имя пользователя"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Пароль"
            required
        >

        <button type="submit">Зарегистрироваться</button>
    </form>

    <p id="message"></p>

    <script src="./register.js"></script>
</body>
</html>
