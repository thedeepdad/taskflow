[project]
name = "teamboard"
version = "0.1.0"
description = "TeamBoard backend"
requires-python = ">=3.14"

dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi[cryptography]>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "psycopg2>=2.9.12",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyjwt[crypto]>=2.13.0",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn>=0.52.1",
    "pgcli>=4.7.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

pythonpath = ["."]
addopts = [
    "-vv",
]


[tool.uv]
package = false
