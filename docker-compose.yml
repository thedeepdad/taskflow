
services:
  backend:
    build: ./backend
    env_file:
      - .env
    volumes:
      - ./keys:/app/keys
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbit:
        condition: service_started
    restart: unless-stopped

  worker:
    build: ./backend
    entrypoint: ["uv", "run", "python", "-m", "worker.email_worker"]
    env_file:
      - .env
    depends_on:
      rabbit:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:18
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbit:
    image: rabbitmq:4-management-alpine
    container_name: rabbit
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    ports:
      - "${RABBIT_PORT}:5672"
      - "${RABBIT_PORT_GUI}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data:
